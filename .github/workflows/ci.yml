name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pop_engine_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pop_engine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:baseline # BASELINE.md APPROVED rows must match file headers (governance §3; issue #70)
      - run: pnpm --filter api migrate up
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:coverage
      # `pnpm test:cofiring` is deliberately NOT a step here. Its only input is the full-draft
      # ruleset under `rules/proposals/`, which `docs/BASELINE.md` carries as
      # "ARCHIVED / PROPOSED drafts". Running it here would make a PROPOSED artifact an enforced
      # main-branch input, so an ordinary revision of the proposal would fail CI until the
      # measurement suite was resynchronised with it, against AGENTS.md's rule to stop rather than
      # build against a proposed input. The harness stays committed and stays runnable on demand
      # (`pnpm test:cofiring`); it becomes a CI step when the draft's baseline row is APPROVED.
      - run: pnpm build # Next build catches route/render/config failures tsc --noEmit misses (matches the Railway web build)
